[package]
name = "codex-proxy-match-ua"
version = "0.1.2"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[dependencies]
form_urlencoded = "1.2"
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "ba8745a7140396bf93cc7d314fcdaf0f21dbf6e5", features = ["io"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
