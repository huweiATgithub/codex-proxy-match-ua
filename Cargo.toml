[package]
name = "codex-proxy-match-ua"
version = "0.1.3"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[dependencies]
form_urlencoded = "1.2"
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "ba8745a7140396bf93cc7d314fcdaf0f21dbf6e5", features = ["io"] }
rusqlite = { version = "0.43", features = ["bundled"] }
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"
