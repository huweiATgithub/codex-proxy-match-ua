<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="codex-proxy-ui-theme-prefix" content="cp">
  <title>UA rejections</title>
  <style>
    :root {
      color-scheme: light;
      --text: var(--cp-color-text, #20272f);
      --muted: var(--cp-color-text-secondary, #52606e);
      --line: var(--cp-color-border, #cbd2d9);
      --surface: var(--cp-color-bg-container, #fff);
      --inset: var(--cp-color-fill-quaternary, #f4f6f8);
      --accent: var(--cp-color-primary, #315ba7);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --text: var(--cp-color-text, #e7ebef);
      --muted: var(--cp-color-text-secondary, #a9b5c1);
      --line: var(--cp-color-border, #46515c);
      --surface: var(--cp-color-bg-container, #20262c);
      --inset: var(--cp-color-fill-quaternary, #2d353f);
      --accent: var(--cp-color-primary, #91b6ff);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); font: 14px/1.5 var(--cp-font-family, Inter, system-ui, sans-serif); }
    form, footer { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    form { margin-bottom: 1rem; }
    label { font-weight: 600; }
    input, button { color: inherit; font: inherit; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); padding: .4rem .75rem; }
    input { width: 24rem; max-width: 100%; }
    button, summary { cursor: pointer; }
    button:not(:disabled):hover, summary:hover { background: var(--inset); }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #refresh { margin-inline-start: auto; }
    #list { border-block-start: 1px solid var(--line); }
    details { border-block-end: 1px solid var(--line); background: var(--surface); }
    summary { padding: .7rem .65rem; }
    .summary { display: inline-grid; width: calc(100% - 1.5rem); grid-template-columns: 11rem minmax(9rem, 1fr) minmax(12rem, 2fr); gap: .6rem; vertical-align: middle; align-items: baseline; }
    time, dt, #status { color: var(--muted); }
    time { font-variant-numeric: tabular-nums; }
    code { font: .9em/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
    code, dd, strong { overflow-wrap: anywhere; }
    .detail { padding: .1rem 1rem 1rem; }
    .detail p { margin: .3rem 0 .8rem; }
    dl { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: .35rem 1rem; margin: 0; }
    dd { margin: 0; }
    dd code { white-space: pre-wrap; }
    footer { margin-top: .8rem; }
    #status { margin: 0 auto 0 0; }
    #status[data-error] { color: var(--cp-color-error-text, var(--text)); }
    [hidden] { display: none !important; }
    @media (max-width: 640px) {
      form { gap: .45rem; }
      label { flex-basis: 100%; }
      input { flex: 1 1 11rem; min-width: 0; }
      .summary { grid-template-columns: 1fr; gap: .1rem; }
      dl { grid-template-columns: 1fr; gap: 0; }
      dd { margin-bottom: .4rem; }
    }
  </style>
</head>
<body>
  <main>
    <form id="search">
      <label for="request-id">Request ID</label>
      <input id="request-id" type="search" placeholder="Exact gateway request ID" autocomplete="off" spellcheck="false">
      <button type="submit">Search</button>
      <button id="refresh" type="button">Refresh</button>
    </form>
    <section aria-label="Rejected requests" id="list"></section>
    <footer>
      <p role="status" id="status"></p>
      <nav aria-label="Result pages" hidden><button id="previous" type="button">Previous</button> <button id="next" type="button">Next</button></nav>
    </footer>
  </main>
  <script>
    const form = document.querySelector("#search");
    const input = document.querySelector("#request-id");
    const list = document.querySelector("#list");
    const status = document.querySelector("#status");
    const nav = document.querySelector("nav");
    const previous = document.querySelector("#previous");
    const next = document.querySelector("#next");
    let sequence = 0;
    let pages = [null];
    let requestId = "";
    let nextCursor = null;
    const dates = new Intl.DateTimeFormat(undefined, { dateStyle: "short", timeStyle: "medium" });

    function element(tag, text) {
      const node = document.createElement(tag);
      node.textContent = text;
      return node;
    }

    function field(list, label, value, asCode = false) {
      const definition = document.createElement("dd");
      if (asCode) definition.append(element("code", value));
      else definition.textContent = value;
      list.append(element("dt", label), definition);
    }

    function uaSample(value, count) {
      if (count === 0) return "Missing";
      if (count > 1) return count + " headers · first value: " + (value || "(empty)");
      return value || "(empty)";
    }

    function render(entry) {
      const row = document.createElement("details");
      const summary = document.createElement("summary");
      const columns = document.createElement("span");
      columns.className = "summary";
      const instant = new Date(entry.rejectedAt * 1000);
      const time = element("time", dates.format(instant));
      time.dateTime = time.title = instant.toISOString();
      const platforms = (entry.clientPlatform || "Unknown") + " → " + (entry.effectivePlatform || "Unknown");
      columns.append(time, element("strong", platforms), element("code", entry.requestId));
      summary.append(columns);
      const detail = document.createElement("div");
      detail.className = "detail";
      const fields = document.createElement("dl");
      field(fields, "Client User-Agent", uaSample(entry.clientUa, entry.clientUaCount), true);
      field(fields, "Effective key User-Agent", uaSample(entry.effectiveUa, entry.effectiveUaCount), true);
      field(fields, "Client key ID", entry.clientKeyId, true);
      field(fields, "Upstream account ID", entry.accountId, true);
      field(fields, "Model", entry.model || "Unknown");
      field(fields, "Upstream transport", entry.transport.toUpperCase());
      field(fields, "Attempt index", entry.attemptIndex);
      field(fields, "Reason code", entry.reason, true);
      detail.append(element("p", entry.message), fields);
      row.append(summary, detail);
      return row;
    }

    async function load() {
      const current = ++sequence;
      const query = new URLSearchParams();
      if (requestId) query.set("requestId", requestId);
      if (pages.at(-1)) query.set("before", pages.at(-1));
      nextCursor = null;
      list.replaceChildren();
      list.setAttribute("aria-busy", "true");
      nav.hidden = true;
      status.removeAttribute("data-error");
      status.textContent = "Loading rejections…";
      try {
        const reply = await window.codexProxyPlugin.request({ method: "GET", path: "api/rejections", query: query.toString() });
        const data = JSON.parse(new TextDecoder().decode(reply.body));
        if (reply.status !== 200) throw new Error(data.error || "Could not load rejection records.");
        if (current !== sequence) return;
        list.replaceChildren(...data.items.map(render));
        nextCursor = data.nextCursor;
        if (data.items.length) {
          status.textContent = data.items.length + (data.items.length === 1 ? " rejection" : " rejections") + " · Page " + pages.length;
        } else {
          status.textContent = requestId ? "No rejections match this request ID." : "No rejections recorded.";
        }
      } catch (error) {
        if (current !== sequence) return;
        status.setAttribute("data-error", "");
        status.textContent = (error.message || "Could not load rejection records.") + " Use Refresh to retry.";
      } finally {
        if (current === sequence) {
          list.setAttribute("aria-busy", "false");
          previous.disabled = pages.length === 1;
          next.disabled = !nextCursor;
          nav.hidden = previous.disabled && next.disabled;
        }
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      requestId = input.value.trim();
      pages = [null];
      load();
    });
    document.querySelector("#refresh").addEventListener("click", load);
    previous.addEventListener("click", () => { pages.pop(); load(); });
    next.addEventListener("click", () => { if (nextCursor) { pages.push(nextCursor); load(); } });
    load();
  </script>
</body>
</html>
