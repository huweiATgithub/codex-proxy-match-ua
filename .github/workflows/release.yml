name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    name: Publish verified release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-package
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-evidence-*
          merge-multiple: true
          path: dist/verification
      - name: Prepare the verified release assets
        env:
          ARCHIVE: ${{ needs.verify.outputs.archive }}
        run: python3 ci/release.py prepare dist/release dist/verification "$ARCHIVE"
      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          HOST_RANGE: ${{ needs.verify.outputs.host-range }}
          SDK_REVISION: ${{ needs.verify.outputs.sdk-revision }}
        run: bash ci/publish.sh
