name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Version tag to check against the package
        type: string
        default: ''
    outputs:
      archive:
        value: ${{ jobs.build.outputs.archive }}
      host-range:
        value: ${{ jobs.build.outputs.host-range }}
      sdk-revision:
        value: ${{ jobs.build.outputs.sdk-revision }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Rust tests and plugin package
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      archive: ${{ steps.metadata.outputs.archive }}
      host-range: ${{ steps.metadata.outputs.host-range }}
      sdk-revision: ${{ steps.metadata.outputs.sdk-revision }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check versions, SDK pin and verification hosts
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python3 ci/release.py metadata --tag "$RELEASE_TAG"
      - name: Check out the matching host packaging CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zyycn/codex-proxy-rs
          ref: ${{ steps.metadata.outputs.sdk-revision }}
          path: _host
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            _host/backend -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Check release architecture and glibc requirement
        run: python3 ci/release.py check-elf target/release/codex-proxy-match-ua
      - name: Build packaging CLI
        run: cargo build --manifest-path _host/backend/Cargo.toml --locked -p codex-proxy-plugin-cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Package plugin and check its checksum
        run: |
          _host/backend/target/debug/cpr-plugin package --manifest plugin.json \
            --binary target/release/codex-proxy-match-ua --target x86_64-unknown-linux-gnu \
            --output-dir dist/packages
          (cd dist/packages && sha256sum --check --strict ./*.sha256)
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-package
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Real host integration (${{ matrix.version }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps --only-shell chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-package
          path: dist/packages
      - name: Install package and exercise it on the released host
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_VERSION: ${{ matrix.version }}
          HOST_REVISION: ${{ matrix.revision }}
          HOST_SHA256: ${{ matrix.sha256 }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          bash ci/download-host.sh "$HOST_VERSION" "$HOST_REVISION" "$HOST_SHA256" "$RUNNER_TEMP/host"
          python3 ci/verify-host.py --release "$RUNNER_TEMP/host/codex-proxy-rs" \
            --package "dist/packages/$ARCHIVE" --version "$HOST_VERSION" \
            --evidence "dist/verification/$HOST_VERSION.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-evidence-${{ matrix.version }}
          path: dist/verification/
          if-no-files-found: error
          retention-days: 14
